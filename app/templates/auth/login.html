<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — StealthOak</title>
    <link rel="stylesheet" href="/static/css/style.css?v=20260602a">
    <!-- Apply saved theme before render to avoid a flash of wrong theme -->
    <script>
        (function () {
            var t = localStorage.getItem('so-theme');
            if (t) document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <style>
        /* ── Login page layout ── */
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: var(--bg-primary, #f5f5f5);
        }

        .login-card {
            background: var(--bg-secondary, #ffffff);
            border: 1px solid var(--border-color, #e0e0e0);
            border-radius: 12px;
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-primary, #1a1a1a);
            margin: 0 0 0.25rem;
        }

        .login-header p {
            font-size: 0.85rem;
            color: var(--text-secondary, #666);
            margin: 0;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-primary, #1a1a1a);
            margin-bottom: 0.4rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.625rem 0.75rem;
            border: 1px solid var(--border-color, #d1d5db);
            border-radius: 6px;
            font-size: 0.95rem;
            background: var(--bg-primary, #fff);
            color: var(--text-primary, #1a1a1a);
            box-sizing: border-box;
            transition: border-color 0.15s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent-color, #2d7d46);
            box-shadow: 0 0 0 3px rgba(45, 125, 70, 0.12);
        }

        .login-btn {
            width: 100%;
            padding: 0.7rem;
            background: var(--accent-color, #2d7d46);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.15s;
            margin-top: 0.5rem;
        }

        .login-btn:hover {
            opacity: 0.88;
        }

        .error-banner {
            background: #fef2f2;
            border: 1px solid #fca5a5;
            border-radius: 6px;
            color: #991b1b;
            font-size: 0.875rem;
            padding: 0.6rem 0.85rem;
            margin-bottom: 1.25rem;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <h1>🌳 StealthOak</h1>
            <p>Grow silently</p>
        </div>

        {% if error %}
        <div class="error-banner">{{ error }}</div>
        {% endif %}

        <form action="/login" method="post" novalidate>
            <div class="form-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    value="{{ username_value or '' }}"
                    autocomplete="username"
                    autofocus
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit" class="login-btn">Sign In</button>
        </form>
    </div>
</body>
</html>
